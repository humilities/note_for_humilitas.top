const sun=new THREE.Mesh(new THREE.SphereGeometry(3.3,48,32),new THREE.MeshBasicMaterial({map:texture(28,'#fff2bb','#8f321f',24,'lava')}));scene.add(sun);const glow=new THREE.Mesh(new THREE.SphereGeometry(4.4,32,24),new THREE.MeshBasicMaterial({color:0xffa13a,transparent:true,opacity:.12,side:THREE.BackSide}));scene.add(glow);
const hidden=[{name:'量子月',tag:'QUANTUM MOON · 观测异常',radius:1.25,hue:220,light:'#e9edf0',dark:'#303b4d',style:'moon',orbit:{radius:22,ecc:.2},phase:0,speed:.12,lead:'它只在被观察时存在',text:'量子月会在六个行星位置之间移动。只有持续观察或拍摄时，它才会停留在当前位置。',link:'/notes/'},{name:'黑洞',tag:'BLACK HOLE · 碎空星核心',radius:1.15,hue:0,light:'#10131a',dark:'#010204',kind:'blackhole',localRadius:.55,localSpeed:0,phase:0,lead:'光也会在这里下坠',text:'碎空星内部的黑洞连接到白洞。靠近核心会让探测器坠入另一侧。',link:'/algorithm/'},{name:'白洞',tag:'WHITE HOLE · 逃逸信号',radius:1.05,hue:210,light:'#d6f0ff',dark:'#426b91',kind:'whitehole',localRadius:1.1,localSpeed:0,phase:Math.PI,lead:'从另一侧返回',text:'白洞与碎空星黑洞相连，白洞站就在它附近。',link:'/algorithm/'},{name:'太阳站',tag:'SUN STATION · 禁止接近',radius:.62,hue:40,light:'#e7c477',dark:'#47321d',kind:'station',orbit:{radius:5.5,ecc:.16,inclination:.18},phase:1.2,speed:.48,lead:'太阳边缘的古老轨道站',text:'太阳站绕太阳运行，连接着双星系统最危险的航线。',link:'/projects/'}];hidden[1].parentBody=brittle;hidden[2].parentBody=brittle;hidden.forEach(d=>{makePlanet(d);d.group.visible=false;if(d.orbit)makeOrbitLine(d)});const q=hidden[0],black=hidden[1],white=hidden[2],sunStation=hidden[3];
const probe=new THREE.Group();const probeBody=new THREE.Mesh(new THREE.ConeGeometry(.35,1.5,8),new THREE.MeshStandardMaterial({color:0xd9c69d,roughness:.7}));probeBody.rotation.z=Math.PI/2;probe.add(probeBody);probe.add(new THREE.PointLight(0xffd37c,1.4,5));probe.visible=false;scene.add(probe);
let probeT=0,selected=null,orbitOn=true,hiddenOn=false,probeOn=false,timeScale=1,simTime=0;const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),down=new THREE.Vector2();function showPanel(d){selected=d;document.querySelector('#panelTag').textContent='观测档案 · '+d.tag;document.querySelector('#panelTitle').textContent=d.name;document.querySelector('#panelLead').textContent=d.lead;document.querySelector('#panelText').textContent=d.text;document.querySelector('#panelLink').innerHTML=d.link?'<a href="'+d.link+'">进入对应笔记 →</a>':'';document.querySelector('#panel').classList.add('open');flyTo(d)}function flyTo(d){if(!d.group)return;const p=d.group.getWorldPosition(new THREE.Vector3());const dir=p.clone().normalize();const dest=p.clone().add(dir.multiplyScalar(d.radius*4+6));camera.position.lerp(dest,.12);controls.target.lerp(p,.12)}canvas.addEventListener('pointerdown',e=>down.set(e.clientX,e.clientY));canvas.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>8)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(scene.children.flatMap(o=>o.children&&o.children.length?o.children:[o]),true);const hit=hits.find(h=>h.object.userData&&h.object.userData.name);if(hit)showPanel(hit.object.userData)});
document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');document.querySelector('#pauseOrbit').onclick=e=>{orbitOn=!orbitOn;e.target.textContent=orbitOn?'暂停公转':'恢复公转';e.target.classList.toggle('active',!orbitOn)};document.querySelector('#probeBtn').onclick=e=>{probeOn=!probeOn;probe.visible=probeOn;probeT=0;e.target.textContent=probeOn?'收回探测器':'发射探测器';e.target.classList.toggle('active',probeOn);toast(probeOn?'探测器已发射 · 正在捕获轨道':'探测器已收回')};document.querySelector('#hiddenBtn').onclick=e=>{hiddenOn=!hiddenOn;hidden.forEach(d=>d.group.visible=hiddenOn);e.target.textContent=hiddenOn?'隐藏异常天体':'扫描隐藏天体';e.target.classList.toggle('active',hiddenOn);toast(hiddenOn?'量子月、黑洞、白洞和太阳站已显现':'异常信号暂时关闭')};
const navigable=[...bodies,...satellites,...hidden];document.querySelectorAll('.nav button').forEach(button=>{button.onclick=()=>{const body=navigable.find(item=>item.name===button.dataset.body);if(!body){toast('信号未锁定 · 请先扫描隐藏天体');return}if(hidden.includes(body)){hiddenOn=true;hidden.forEach(item=>item.group.visible=true);const scan=document.querySelector('#hiddenBtn');scan.textContent='隐藏异常天体';scan.classList.add('active')}document.querySelectorAll('.nav button').forEach(item=>item.classList.toggle('active',item===button));showPanel(body)}});document.querySelector('#timeScale').onchange=event=>{timeScale=Number(event.target.value);toast('时间流速 · '+event.target.value+'x')};
const audio=document.querySelector('#bgm');document.querySelector('#musicBtn').onclick=async e=>{try{if(audio.paused){await audio.play();e.target.textContent='♫ 音乐：开启';e.target.classList.add('active')}else{audio.pause();e.target.textContent='♫ 音乐：关闭';e.target.classList.remove('active')}}catch{toast('未找到音频文件 · 请放入 /audio/star-frontier-theme.mp3')}};function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2600)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}addEventListener('resize',resize);
function placeOrbit(d,time){if(d.localRadius!==undefined){const a=time*(d.localSpeed||0)+(d.phase||0);d.group.position.set(Math.cos(a)*d.localRadius,Math.sin(a*1.7)*.18,Math.sin(a)*d.localRadius);return}const o=d.orbit||{radius:d.distance||0,ecc:0};const e=o.ecc||0,a=time*(d.speed||0)+(d.phase||0),r=o.radius*(1-e*e)/(1+e*Math.cos(a));const x=Math.cos(a)*r,z=Math.sin(a)*r*Math.sqrt(1-e*e),y=Math.sin(a)*r*Math.sin(o.inclination||0);d.group.position.set(x,y,z)}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=clock.getDelta(),scaledDt=dt*timeScale;if(orbitOn){simTime+=scaledDt;const time=simTime;bodies.forEach(d=>{placeOrbit(d,time);d.group.rotation.y+=scaledDt*.08});satellites.forEach(d=>{placeOrbit(d,time);d.group.rotation.y+=scaledDt*.14});if(hiddenOn){hidden.forEach(d=>{if(d===q){const targets=[timber,brittle,bodies.find(item=>item.name==='深巨星'),bodies.find(item=>item.name==='黑棘星'),bodies.find(item=>item.name==='余烬双星'),bodies.find(item=>item.name==='灰烬双星')];const target=targets[Math.floor(simTime*.12)%targets.length];q.group.position.lerp(target.group.position.clone().add(new THREE.Vector3(0,2.8,0)),.08)}else placeOrbit(d,time)})}sun.rotation.y+=scaledDt*.06;glow.scale.setScalar(1+Math.sin(time*1.6)*.025);if(probeOn){probeT=(probeT+scaledDt*.055)%1;const a=probeT*Math.PI*2;probe.position.set(Math.cos(a)*18,Math.sin(a*2)*2.4,Math.sin(a)*18);probe.lookAt(0,0,0)}}controls.update();renderer.render(scene,camera)}loop();</script>
