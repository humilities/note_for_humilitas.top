const bodies=[{name:'木炉星',tag:'TIMBER HEARTH · 家园信号',radius:2.3,distance:10,hue:78,light:'#b9d879',dark:'#243e31',atmo:0x9bc476,speed:.32,lead:'出发前的营火',text:'这里保存最基础、最可靠的工程记录。\n\n木炉星的信号里有工具、代码和每天都能复用的技巧。先从火堆旁的笔记开始，再把探测器送入深空。',link:'/tech/'},{name:'碎空星',tag:'BROKEN MOON · 崩解中的知识',radius:2,distance:16,hue:274,light:'#d2c2ed',dark:'#2c2149',speed:.23,lead:'结构正在坍塌',text:'复杂问题像这颗星球一样，表面稳定，内部却一直在变化。\n\n算法记录从轨道开始下潜，直到找到结构、边界与不变量。',link:'/algorithm/'},{name:'深巨星',tag:"DEEP GIANT · 风暴观测",radius:2.7,distance:23,hue:190,light:'#98e2e8',dark:'#103a57',atmo:0x7adbe4,speed:.16,lead:'云层之下有另一片海',text:'这里的风暴遮住了系统真正的形状。\n\n服务、数据、网络和运行时记录，都在深巨星的云层里留下轨迹。',link:'/dsc/'},{name:'余烬双星',tag:'EMBER TWIN · 倒计时',radius:1.75,distance:29,hue:22,light:'#ffc87d',dark:'#57252a',speed:.1,lead:'沙粒正在转移',text:'一颗星球的时间会流向另一颗。\n\n课程、读书和阶段性学习记录被放在这里，等待下一次循环。',link:'/notes/'},{name:'灰烬双星',tag:'ASH TWIN · 隐藏入口',radius:1.55,distance:33,hue:34,light:'#ddc897',dark:'#342524',speed:.085,lead:'传送门仍然温热',text:'还没有被归档的实验、草稿与临时想法。\n\n如果你在这里找到一扇门，记得先观察沙子的方向。',link:'/projects/'},{name:'黑棘星',tag:'DARK BRAMBLE · 信号迷宫',radius:2.25,distance:39,hue:112,light:'#7fbb72',dark:'#0c201d',atmo:0x4b984e,speed:.055,lead:'信号会折返',text:'这里的距离不是距离，入口也不总是入口。\n\n思考与随笔像种子一样散落在黑暗里，等待被正确的信号找到。',link:'/thoughts/'},{name:'外来者',tag:'THE STRANGER · 环世界信号',radius:2.8,distance:47,hue:35,light:'#c79855',dark:'#33241f',ring:true,speed:.035,lead:'一座藏在黑暗里的环形世界',text:'关于我和这座档案馆的记录。\n\n外来者不属于这套行星系统，却一直在发出微弱、稳定的信号。',link:'/about/'}];bodies.forEach(makePlanet);const sun=new THREE.Mesh(new THREE.SphereGeometry(3.3,48,32),new THREE.MeshBasicMaterial({map:texture(28,'#fff2bb','#8f321f',24)}));scene.add(sun);const glow=new THREE.Mesh(new THREE.SphereGeometry(4.4,32,24),new THREE.MeshBasicMaterial({color:0xffa13a,transparent:true,opacity:.12,side:THREE.BackSide}));scene.add(glow);
